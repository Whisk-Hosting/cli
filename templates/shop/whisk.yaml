whisk: 1
name: whisk-shop

# The shop has its own sign-in for customers, so the edge lets every request through and the shop
# decides. Staff reach the admin at /app through their Whisk sign-in (/auth/whisk). The website's
# forms (site/) pass the edge's challenge first, so robots cannot fill them.
routes:
  public: ["/**"]
  challenge: ["/forms/*"]

health:
  path: /health/ready
  timeout: 60

database: app
migrate: "node migrate.js"

kv: true
storage: true
email: true

# Bank transfer needs no keys. Each other way to pay is on once its secrets are declared here
# and set (README, Take payments); a deploy waits for every declared secret's value.
secrets: []

env:
  STRIPE_CAPTURE: automatic
  WINDCAVE_ENVIRONMENT: live
  WINDCAVE_CAPTURE: automatic
  PAYPAL_ENVIRONMENT: live
  PAYPAL_CAPTURE: automatic
  SHOP_EMAIL_FROM: ""

whisk: 1
name: whisk-astro

routes:
  public: ["/", "/health"]

health:
  path: /health
  timeout: 30

database: app
migrate: "node dist/migrate.js"
# The app runs as a login that reads and writes rows under every policy and cannot change the
# schema; only migrate runs as the owner (SKILL.md §5).
database_role: restricted

env:
  LOG_LEVEL: info

# Function runs arrive at a route handler (src/pages/api/inngest.ts).
queue:
  endpoint: /api/inngest

functions:
  - name: note-added
    event: note.added
    graph: workflows/note-added.graph.yaml
